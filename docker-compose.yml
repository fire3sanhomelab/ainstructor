version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: ainstructor-backend
    expose:
      - "3456"
    environment:
      - PORT=3456
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - LLM_STUDIO_URL=${LLM_STUDIO_URL:-http://host.docker.internal:1234}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    networks:
      - proxy-network
    labels:
      - "traefik.enable=false"

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: ainstructor
    expose:
      - "8088"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - proxy-network
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ainstructor.rule=Host(`homelab.fire3san.duckdns.org`) && PathPrefix(`/ainstructor`)"
      - "traefik.http.routers.ainstructor.middlewares=auto-strip-prefix@file"
      - "traefik.http.services.ainstructor.loadbalancer.server.port=8088"

networks:
  proxy-network:
    external: true
